<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/vite.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Rusty Compress</title>
        <style>
            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            :root {
                color-scheme: light dark;
                --splash-bg: #ffffff;
                --splash-track: #e5e5e5;
                --splash-accent: #007aff;
                --splash-fg: #6e6e73;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --splash-bg: #1e1e1e;
                    --splash-track: #3a3a3c;
                    --splash-accent: #0a84ff;
                    --splash-fg: #98989d;
                }
            }

            html,
            body {
                background: var(--splash-bg);
            }

            #root-spinner {
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 16px;
                background: var(--splash-bg);
                font-family:
                    -apple-system,
                    BlinkMacSystemFont,
                    "SF Pro Text",
                    system-ui,
                    sans-serif;
                font-size: 13px;
                color: var(--splash-fg);
                overflow: hidden;
                z-index: 9999;
            }

            #root-spinner .spinner {
                width: 24px;
                height: 24px;
                border-radius: 50%;
                border: 2px solid var(--splash-track);
                border-top-color: var(--splash-accent);
                animation: splash-spin 0.8s linear infinite;
            }
            @keyframes splash-spin {
                to {
                    transform: rotate(360deg);
                }
            }
        </style>
    </head>
    <body>
        <div id="root">
            <div id="root-spinner">
                <div class="spinner" role="status" aria-label="Loading"></div>
                <span>Rusty Compress</span>
            </div>
        </div>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
